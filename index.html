<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGPI - Sistema de Gestión de Proyectos de Investigación</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, hsl(220, 23%, 12%) 0%, hsl(260, 20%, 8%) 100%);
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: hsl(0, 0%, 95%);
            --text-secondary: hsl(220, 10%, 70%);
            --accent-primary: hsl(263, 70%, 65%);
            --accent-primary-hover: hsl(263, 70%, 75%);
            --accent-success: hsl(145, 65%, 50%);
            --accent-error: hsl(355, 75%, 55%);
            --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient background glow effects */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(120px);
            z-index: -1;
            opacity: 0.4;
        }

        body::before {
            top: 15%;
            left: 20%;
            background: var(--accent-primary);
        }

        body::after {
            bottom: 15%;
            right: 20%;
            background: hsl(190, 70%, 60%);
        }

        .container {
            max-width: 600px;
            width: 90%;
            perspective: 1000px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: var(--shadow);
            text-align: center;
            transform: translateY(0);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 16px 40px 0 rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .logo {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, hsl(0, 0%, 100%) 0%, hsl(220, 15%, 80%) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .sub-logo {
            font-size: 0.9rem;
            color: var(--accent-primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            margin-bottom: 30px;
        }

        .status-container {
            margin: 24px 0;
            padding: 24px;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: var(--text-secondary);
            position: relative;
            transition: background-color 0.3s;
        }

        .status-indicator.success {
            background-color: var(--accent-success);
            box-shadow: 0 0 12px var(--accent-success);
        }

        .status-indicator.error {
            background-color: var(--accent-error);
            box-shadow: 0 0 12px var(--accent-error);
        }

        .status-indicator.loading {
            background-color: hsl(45, 90%, 55%);
            box-shadow: 0 0 12px hsl(45, 90%, 55%);
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .status-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-message {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
            min-height: 30px;
        }

        .btn {
            background: var(--accent-primary);
            color: white;
            border: none;
            padding: 12px 32px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s, box-shadow 0.2s;
            font-family: inherit;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);
        }

        .btn:hover {
            background: var(--accent-primary-hover);
            box-shadow: 0 6px 20px rgba(124, 58, 237, 0.5);
        }

        .btn:active {
            transform: scale(0.98);
        }

        footer {
            margin-top: 40px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <h1 class="logo">SGPI</h1>
            <div class="sub-logo">UNPA - Universidad del Papaloapan</div>
            
            <div class="status-container">
                <div id="indicator" class="status-indicator loading"></div>
                <div class="status-label">Conexión con el Backend</div>
                <div id="message" class="status-message">Conectando...</div>
            </div>

            <button class="btn" onclick="checkBackendHealth()">Probar Conexión</button>
        </div>
    </div>

    <footer>
        Sistema Integral de Gestión de Proyectos de Investigación &copy; 2026
    </footer>

    <script>
        async function checkBackendHealth() {
            const indicator = document.getElementById('indicator');
            const message = document.getElementById('message');
            
            indicator.className = 'status-indicator loading';
            message.textContent = 'Verificando...';

            try {
                // Fetch the backend health endpoint.
                // We use localhost:8080 directly since the browser connects from local machine.
                const response = await fetch('http://localhost:8080/api/health');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                
                indicator.className = 'status-indicator success';
                message.textContent = data.message || '¡Conexión Exitosa!';
            } catch (error) {
                console.error('Error fetching backend health:', error);
                indicator.className = 'status-indicator error';
                message.textContent = 'Error al conectar con el Backend';
            }
        }

        // Run check on load
        window.addEventListener('DOMContentLoaded', () => {
            // Wait a brief moment to simulate network delay
            setTimeout(checkBackendHealth, 1000);
        });
    </script>
</body>
</html>
